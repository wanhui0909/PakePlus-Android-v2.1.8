<title>酒店房价牌 - 电视专用版（现代设计）</title>
<style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        font-size: 24px;
    }
    
    .main-container {
        width: 100%;
        height: 100%;
        position: relative;
        background: rgba(15, 23, 42, 0.8);
    }
    
    .header {
        background: #0f172a;
        color: #ffffff;
        padding: 20px 40px;
        height: 12%;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        border-bottom: 2px solid #3b82f6;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }
    
    .hotel-name {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #3b82f6;
    }
    
    .hotel-subtitle {
        font-size: 28px;
        color: #cbd5e1;
        letter-spacing: 2px;
    }
    
    .price-table {
        width: 28%;
        background: rgba(30, 41, 59, 0.85);
        position: absolute;
        top: 12%;
        left: 0;
        height: 88%;
        overflow-y: auto;
        padding: 25px 15px;
        z-index: 90;
        border-right: 2px solid rgba(59, 130, 246, 0.3);
    }
    
    .price-title {
        font-size: 24px;
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 2px solid #f59e0b;
        color: #fbbf24;
    }
    
    .room-item {
        background: rgba(30, 41, 59, 0.9);
        margin-bottom: 20px;
        padding: 20px;
        border-radius: 12px;
        border-left: 5px solid #3b82f6;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    
    .room-name {
        font-size: 12px;
        margin-bottom: 8px;
        color: #93c5fd;
        font-weight: bold;
    }
    
    .room-price {
        font-size: 12px;
        font-weight: bold;
        color: #fbbf24;
        margin-bottom: 5px;
    }
    
    .room-desc {
        font-size: 14px;
        margin-top: 8px;
        color: #94a3b8;
        line-height: 1.4;
    }
    
    .slideshow-area {
        width: 72%;
        position: absolute;
        top: 12%;
        left: 28%;
        height: 88%;
        overflow: hidden;
    }
    
    .slideshow-container {
        width: 100%;
        height: 100%;
        position: relative;
    }
    
    .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1.2s;
    }
    
    .slide.active {
        opacity: 1;
    }
    
    .slide-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    
    .slide-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(15, 23, 42, 0.8);
        padding: 20px 40px;
        font-size: 32px;
        text-align: center;
        color: #f8fafc;
        font-weight: bold;
    }
    
    .announcement-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #f59e0b;
        color: #1e293b;
        padding: 18px 0;
        z-index: 100;
        height: 65px;
        overflow: hidden;
        box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .announcement-content {
        display: inline-block;
        white-space: nowrap;
        padding-left: 100%;
        font-size: 26px;
        font-weight: bold;
        animation: scrollText 35s linear infinite;
    }
    
    @keyframes scrollText {
        0% {
            transform: translateX(0);
        }
        100% {
            transform: translateX(-100%);
        }
    }
    
    .slide-dots {
        position: absolute;
        bottom: 75px;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 95;
    }
    
    .dot {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin: 0 8px;
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid rgba(255, 255, 255, 0.5);
    }
    
    .dot.active {
        background-color: #3b82f6;
        border-color: #93c5fd;
    }
    
    .time-display {
        position: absolute;
        bottom: 75px;
        right: 30px;
        background: rgba(15, 23, 42, 0.8);
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 24px;
        color: #cbd5e1;
        border: 1px solid rgba(59, 130, 246, 0.3);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        z-index: 95;
        text-align: center;
        min-width: 300px;
    }
    
    .date-row {
        font-size: 20px;
        margin-bottom: 5px;
        color: #cbd5e1;
    }
    
    .time-row {
        font-size: 28px;
        font-weight: bold;
        color: #93c5fd;
    }
    
    .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.9);
        padding: 30px;
        border-radius: 15px;
        z-index: 1000;
        text-align: center;
        border: 2px solid #3b82f6;
        min-width: 300px;
    }
    
    .loading-text {
        font-size: 28px;
        color: #93c5fd;
        margin-top: 15px;
    }
    
    @media all and (-webkit-min-device-pixel-ratio:0) and (min-resolution: .001dpcm) {
        .room-item, .header {
            -webkit-transform: translateZ(0);
        }
    }
    
    @media screen and (max-width: 1366px) {
        body {
            font-size: 20px;
        }
        
        .hotel-name {
            font-size: 40px;
        }
        
        .room-price {
            font-size: 36px;
        }
        
        .room-name {
            font-size: 28px;
        }
        
        .announcement-content {
            font-size: 22px;
        }
        
        .time-display {
            min-width: 250px;
            font-size: 20px;
        }
        
        .date-row {
            font-size: 18px;
        }
        
        .time-row {
            font-size: 24px;
        }
    }
    
    .price-table::-webkit-scrollbar {
        width: 6px;
    }
    
    .price-table::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.5);
        border-radius: 3px;
    }
    
    .price-table::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 3px;
    }
    
    .error-message {
        background: rgba(239, 68, 68, 0.9);
        color: white;
        padding: 15px;
        border-radius: 10px;
        margin: 10px;
        text-align: center;
        font-size: 22px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        min-width: 400px;
    }
</style>

// 获取农历新年日期（简化版）
function getLunarNewYear(year) {
    // 这里应该是一个完整的农历新年日期表
    // 为简化，我们假设为2月12日左右（实际应根据年份变化）
    return 12; // 返回日期
}

// 格式化日期
function formatDate(date) {
    var weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    var months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
    
    var year = date.getFullYear();
    var month = date.getMonth();
    var day = date.getDate();
    var weekday = date.getDay();
    
    return year + "年" + months[month] + day + "日 " + weekdays[weekday];
}

// 更新时间显示
function updateTime() {
    var now = new Date();
    
    // 更新阳历日期
    document.getElementById('solar-date').textContent = formatDate(now);
    
    // 更新农历日期
    try {
        var lunarDate = getLunarDate(now);
        document.getElementById('lunar-date').textContent = lunarDate;
    } catch (e) {
        document.getElementById('lunar-date').textContent = "农历：计算错误";
    }
    
    // 更新时间
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var seconds = now.getSeconds();
    
    hours = hours < 10 ? '0' + hours : hours;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    
    document.getElementById('current-time').textContent = hours + ':' + minutes + ':' + seconds;
}

// 从接口获取数据
function fetchHotelData() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://www.zykj0579.com/api/hotelPrice/qtData.php', true);
    xhr.timeout = 10000; // 10秒超时
    
    xhr.onload = function() {
        console.log(xhr)
        if (xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                updatePageWithData(data.data);
            } catch (e) {
                console.error('解析JSON数据失败:', e);
                showError('数据格式错误，请稍后重试');
            }
        } else {
            showError('网络请求失败，状态码: ' + xhr.status);
        }
    };
    
    xhr.onerror = function() {
        showError('网络连接错误，请检查网络');
    };
    
    xhr.ontimeout = function() {
        showError('请求超时，请稍后重试');
    };
    
    xhr.send();
}

// 使用数据更新页面
function updatePageWithData(data) {
    console.log("a",data)
    // 更新酒店名称
    if (data.hotelName) {
        document.getElementById('hotel-title').textContent = data.hotelName;
    }
    
    // 更新酒店副标题
    if (data.hotelSubtitle) {
        document.getElementById('hotel-subtitle').textContent = data.hotelSubtitle;
    }
    
    // 更新房价表
    if (data.rooms && data.rooms.length > 0) {
        var roomsContainer = document.getElementById('rooms-container');
        roomsContainer.innerHTML = '';
        
        for (var i = 0; i < data.rooms.length; i++) {
            var room = data.rooms[i];
            var roomElement = document.createElement('div');
            roomElement.className = 'room-item';
            roomElement.innerHTML = 
                '<div class="room-name">' + room.name + '</div>' +
                '<div class="room-price">¥' + room.price + ' / 晚</div>' +
                '<div class="room-desc">' + room.desc + '</div>';
            
            roomsContainer.appendChild(roomElement);
        }
    }
    
    // 更新公告
    if (data.announcement) {
        document.getElementById('announcement-content').textContent = data.announcement;
    }
}

// 显示错误信息
function showError(message) {
    var errorElement = document.createElement('div');
    errorElement.className = 'error-message';
    errorElement.textContent = '⚠️ ' + message + ' (使用模拟数据)';
    document.body.appendChild(errorElement);
    
    // 3秒后移除错误信息
    setTimeout(function() {
        if (errorElement.parentNode) {
            errorElement.parentNode.removeChild(errorElement);
        }
    }, 3000);
    
    // 使用模拟数据
    useMockData();
}

// 显示指定索引的幻灯片
function showSlide(index) {
    for (var i = 0; i < slides.length; i++) {
        slides[i].className = 'slide';
        dots[i].className = 'dot';
    }
    
    if (slides[index]) {
        slides[index].className = 'slide active';
        dots[index].className = 'dot active';
        currentSlide = index;
    }
}

// 下一张幻灯片
function nextSlide() {
    var nextIndex = currentSlide + 1;
    if (nextIndex >= slides.length) {
        nextIndex = 0;
    }
    showSlide(nextIndex);
}

// 开始自动轮播
function startSlideshow() {
    if (slideInterval) {
        clearInterval(slideInterval);
    }
    
    slideInterval = setInterval(nextSlide, 6000);
}

// 为控制点添加点击事件
for (var i = 0; i < dots.length; i++) {
    (function(index) {
        dots[index].onclick = function() {
            showSlide(index);
            startSlideshow();
        };
    })(i);
}

// 图片加载失败处理
var images = document.getElementsByTagName('img');
for (var j = 0; j < images.length; j++) {
    images[j].onerror = function() {
        this.style.display = 'none';
    };
}

// 页面加载完成后执行
window.onload = function() {
    console.log('页面加载完成，开始初始化...');
    
    // 初始化时间显示
    updateTime();
    setInterval(updateTime, 1000);
    
    // 开始幻灯片轮播
    showSlide(0);
    startSlideshow();
    
    // 从接口获取数据
    fetchHotelData();
    
    // 添加错误处理
    window.onerror = function(msg, url, line) {
        console.log('页面错误: ' + msg + ' at ' + url + ':' + line);
        return true;
    };
    
    console.log('初始化完成');
};

// 简单的重试机制 - 如果页面加载失败，5秒后重试
setTimeout(function() {
    if (!document.body || document.body.innerHTML === '') {
        console.log('页面加载异常，尝试刷新...');
        window.location.reload();
    }
}, 5000);
</script>
