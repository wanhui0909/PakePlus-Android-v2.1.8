<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>酒店房价牌 - 电视专用版（现代设计）</title>
    <style type="text/css">
        /* 重置样式和根字体大小 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    /* 根元素字体大小基于视口宽度动态调整 - 关键修改 */
    html {
        font-size: calc(100vw / 1920 * 16); /* 基于1920px设计稿，1rem = 16px */
    }
    
    /* 针对不同屏幕尺寸的字体大小调整 */
    @media screen and (max-width: 1920px) {
        html {
            font-size: calc(100vw / 1920 * 14); /* 较小屏幕减小基准 */
        }
    }
    
    @media screen and (max-width: 1366px) {
        html {
            font-size: calc(100vw / 1366 * 12); /* 小屏幕进一步减小 */
        }
    }
    
    @media screen and (max-width: 1024px) {
        html {
            font-size: calc(100vw / 1024 * 10); /* 平板尺寸调整 */
        }
    }
    
    @media screen and (max-width: 768px) {
        html {
            font-size: calc(100vw / 768 * 9); /* 手机尺寸调整 */
        }
    }
    
    body {
        font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        font-size: 1rem; /* 使用rem单位，不再是固定px */
    }
    
    .main-container {
        width: 100%;
        height: 100%;
        position: relative;
        background: #F5F1E6;
    }
    
    /* 头部区域 - 使用rem单位 */
    .header {
        background: #0f172a;
        color: #ffffff;
        padding: 1.25rem 2.5rem; /* 20px/16 = 1.25rem, 40px/16 = 2.5rem */
        height: 12%;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        border-bottom: 0.125rem solid #3b82f6; /* 2px/16 = 0.125rem */
        box-shadow: 0 0.3125rem 0.9375rem rgba(0, 0, 0, 0.5); /* 5px/16, 15px/16 */
    }
    
    .hotel-name {
        font-size:3rem; /* 48px/16 = 3rem */
        font-weight: bold;
        margin-bottom: 0.3125rem; /* 5px/16 */
        color: #3b82f6;
        line-height: 1.2;
    }
    
    .hotel-subtitle {
        font-size: 1.75rem; /* 28px/16 = 1.75rem */
        color: #cbd5e1;
        letter-spacing: 0.125rem; /* 2px/16 */
    }
    
    /* 房价表区域 - 使用rem单位 */
    .price-table {
        width: 40%;
        background: #FFF;;
        position: absolute;
        top: 0;
        left: 0;
        height: 92%;
        /* 移除overflow-y: auto，改为隐藏 */
        overflow: hidden;
        padding: 1.5625rem 0.9375rem; /* 25px/16, 15px/16 */
        z-index: 90;
        border-right: 0.125rem solid #D8D2C3; /* 2px/16 */
    }
    
    .price-title {
        font-size: 4rem; /* 38px/16 = 2.375rem */
        text-align: center;
        margin-bottom: 1.875rem; /* 30px/16 */
        padding-bottom: 0.9375rem; /* 15px/16 */
        border-bottom: 0.125rem solid #A69276; /* 2px/16 */
        color: #A69276;
        line-height: 1.3;
    }
    
    /* 新增滚动容器样式 */
    #rooms-container {
        position: relative;
        width: 100%;
        height: calc(100% - 8rem); /* 减去标题高度 */
        overflow: hidden;
    }
    
    .scroll-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        transition: transform 0.5s ease-out;
    }
    
    .room-item {
        background: #EAE6D8;
        margin-bottom: 1.25rem; /* 20px/16 */
        padding:8px 12px; /* 20px/16 */
        border-radius: 0.75rem; /* 12px/16 */
        border-left: 0.3125rem solid #F0C75E; /* 5px/16 */
        box-shadow: 0 0.25rem 0.375rem rgba(0, 0, 0, 0.3); /* 4px/16, 6px/16 */
        display: flex;
        flex-wrap: wrap;
    }

    .room-items {
        background: #c2c2c2;
        margin-bottom: 1.25rem; /* 20px/16 */
        padding:8px 12px; /* 20px/16 */
        border-radius: 0.75rem; /* 12px/16 */
        border-left: 0.3125rem solid #F0C75E; /* 5px/16 */
        box-shadow: 0 0.25rem 0.375rem rgba(0, 0, 0, 0.3); /* 4px/16, 6px/16 */
        display: flex;
        flex-wrap: wrap;
    }
    
    /* 关键修改：房价名称和价格的字体大小调整 */
    .room-name {
        font-size: 3.5rem; /* 30px/16 = 1.875rem */
        margin-bottom: 0.5rem; /* 8px/16 */
        color: #2C3E50;
        font-weight: bold;
        line-height: 36px;
        width: 62%;
    }
    .roomNum{
        color: #0b097e;
        font-size: 2.8rem; /* 40px/16 = 2.5rem - 适当减小 */
        font-weight: bold;
        width: 36%;
        text-align: right;
    }
    .roomNums{
        color: #af0909;
        font-size: 2.8rem; /* 40px/16 = 2.5rem - 适当减小 */
        font-weight: bold;
        width: 36%;
        text-align: right;
    }
    .room-oldPrice {
        font-size: 2.8rem; /* 40px/16 = 2.5rem - 适当减小 */
        font-weight: bold;
        color: #5e5a55;
        margin-bottom: 0.3125rem; /* 5px/16 */
        line-height: 1.2;
        text-decoration: line-through;
        margin-right: 10px;
    }
    .room-price {
        font-size: 4rem; /* 40px/16 = 2.5rem - 适当减小 */
        font-weight: bold;
        color: #a17f0f;
        margin-bottom: 0.3125rem; /* 5px/16 */
        line-height: 1.2;
        text-align: right;
        width: 36%;
    }
    
    .room-desc {
        font-size: 2.2rem; /* 22px/16 = 1.375rem */
        margin-top: 0.5rem; /* 8px/16 */
        color: #5e5a55;
        line-height: 24px;
        width: 62%;
    }
    
    /* 幻灯片区域 */
    .slideshow-area {
        width: 60%;
        position: absolute;
        top: 0;
        left: 40%;
        height: 92%;
        overflow: hidden;
    }
    
    .slideshow-container {
        width: 100%;
        height: 100%;
        position: relative;
    }
    
    .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1.2s;
    }
    
    .slide.active {
        opacity: 1;
    }
    
    .slide-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    
    .slide-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #EAE6D8;
        padding: 1.25rem 2.5rem; /* 20px/16, 40px/16 */
        font-size: 1.8rem; /* 32px/16 = 2rem */
        text-align: center;
        color: #7F8C8D;
        line-height: 1.3;
    }
    
    /* 公告栏 */
    .announcement-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #f59e0b;
        color: #FFF;
        padding: 1.125rem 0; /* 18px/16 */
        z-index: 100;
        height: 8%; /* 65px/16 */
        overflow: hidden;
        box-shadow: 0 -0.3125rem 0.9375rem rgba(0, 0, 0, 0.3); /* 5px/16, 15px/16 */
    }
    
    .announcement-wrapper {
        position: absolute;
        white-space: nowrap;
        font-size: 4rem; /* 26px/16 = 1.625rem */
        line-height: 100%;
    }
    
    /* 幻灯片指示器 */
    .slide-dots {
        position: absolute;
        bottom: 4.6875rem; /* 75px/16 */
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 95;
    }
    
    .dot {
        display: inline-block;
        width: 0.875rem; /* 14px/16 */
        height: 0.875rem; /* 14px/16 */
        margin: 0 0.5rem; /* 8px/16 */
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        cursor: pointer;
        border: 0.125rem solid rgba(255, 255, 255, 0.5); /* 2px/16 */
    }
    
    .dot.active {
        background-color: #3b82f6;
        border-color: #93c5fd;
    }
    
    /* 时间显示 */
    .time-display {
        position: absolute;
        top: 2.6875rem; /* 75px/16 */
        right: 1.875rem; /* 30px/16 */
        background: #F5F1E6;
        padding: 0.625rem 1.25rem; /* 10px/16, 20px/16 */
        border-radius: 1.25rem; /* 20px/16 */
        font-size: 2rem; /* 24px/16 = 1.5rem */
        color: #5D6D7E;
        border: 0.0625rem solid #F0C75E; /* 1px/16 */
        box-shadow: 0 0.25rem 0.375rem rgba(140, 140, 140, 0.25); /* 4px/16, 6px/16 */
        z-index: 95;
        text-align: center;
        min-width: 18.75rem; /* 300px/16 */
        line-height: 1.3;
        opacity: 0.8;
    }
    
    .date-row {
        font-size: 2.25rem; /* 20px/16 = 1.25rem */
        margin-bottom: 0.3125rem; /* 5px/16 */
        color: #5D6D7E;
    }
    
    .time-row {
        font-size: 2.75rem; /* 28px/16 = 1.75rem */
        font-weight: bold;
        color: #A69276;
    }
    
    /* 加载状态 */
    .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.9);
        padding: 1.875rem; /* 30px/16 */
        border-radius: 0.9375rem; /* 15px/16 */
        z-index: 1000;
        text-align: center;
        border: 0.125rem solid #3b82f6; /* 2px/16 */
        min-width: 18.75rem; /* 300px/16 */
    }
    
    .loading-text {
        font-size: 1.75rem; /* 28px/16 = 1.75rem */
        color: #93c5fd;
        margin-top: 0.9375rem; /* 15px/16 */
        max-height: 70vh;
    }
    
    /* 错误提示 */
    .error-message {
        background: rgba(239, 68, 68, 0.9);
        color: white;
        padding: 0.9375rem; /* 15px/16 */
        border-radius: 0.625rem; /* 10px/16 */
        margin: 0.625rem; /* 10px/16 */
        text-align: center;
        font-size: 1.375rem; /* 22px/16 = 1.375rem */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        min-width: 25rem; /* 400px/16 */
    }
    
    /* 滚动条美化 - 现在用不到了，保留备用 */
    .price-table::-webkit-scrollbar {
        width: 0.375rem; /* 6px/16 */
    }
    
    .price-table::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.5);
        border-radius: 0.1875rem; /* 3px/16 */
    }
    
    .price-table::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 0.1875rem; /* 3px/16 */
    }
    
    /* VIA浏览器专用修复 */
    @media all and (-webkit-min-device-pixel-ratio:0) and (min-resolution: .001dpcm) {
        /* 针对VIA浏览器的特殊优化 */
        .room-item, .header {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        
        /* 修复字体渲染 */
        .room-name, .room-price, .hotel-name {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
    }
    
    /* 字体大小调整的媒体查询 */
    @media screen and (max-width: 1920px) {
        .hotel-name {
            font-size: 3rem; /* 40px */
        }
        
        .room-price {
            font-size: 4rem; /* 36px */
        }
        
        .room-name {
            font-size: 4rem; /* 28px */
        }
        
        .announcement-wrapper {
            font-size: 3rem; /* 22px */
        }
        
        .time-display {
            min-width: 15.625rem; /* 250px */
            font-size: 2rem; /* 20px */
        }
        
        .date-row {
            font-size: 2rem; /* 18px */
        }
        
        .time-row {
            font-size: 2.75rem; /* 24px */
        }
    }
    
    /* 针对低分辨率电视的额外优化 */
    @media screen and (max-height: 800px) {
        .room-price {
            font-size: 4rem; /* 32px - 在高度较小的屏幕上进一步减小 */
        }
        
        .room-name {
            font-size: 4rem; /* 24px */
        }
        
        .price-title {
            font-size: 3.5rem; /* 30px */
            margin-bottom: 1.25rem; /* 20px */
        }
    }
    
    /* 针对高DPI设备的优化 */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
        /* 在高DPI设备上微调字体大小 */
        .room-price {
            font-size: 4rem; /* 38px */
        }
        
        .room-name {
            font-size: 4rem; /* 28px */
        }
        
        .room-desc {
            font-size: 2.5rem; /* 20px */
        }
    }
    </style>

            function adjustRootFontSize() {
                var screenWidth = window.innerWidth || document.documentElement.clientWidth;
                var baseFontSize;

                if (screenWidth >= 1920) {
                    baseFontSize = 16;
                } else if (screenWidth >= 1366) {
                    baseFontSize = 14;
                } else if (screenWidth >= 1024) {
                    baseFontSize = 12;
                } else if (screenWidth >= 768) {
                    baseFontSize = 10;
                } else {
                    baseFontSize = 9;
                }

                // 计算rem基准值
                var rootFontSize = (screenWidth / 1920) * baseFontSize;
                document.documentElement.style.fontSize = rootFontSize + 'px';

                    this.lunarMonths = ["正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "腊月"];
                    // 农历日期
                    this.lunarDays = ["初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
                        "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
                        "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
                    // 节气
                    this.solarTerms = ["小寒", "大寒", "立春", "雨水", "惊蛰", "春分", "清明", "谷雨", "立夏", "小满",
                        "芒种", "夏至", "小暑", "大暑", "立秋", "处暑", "白露", "秋分", "寒露", "霜降",
                        "立冬", "小雪", "大雪", "冬至"];

                    // 公历每月天数（非闰年）
                    this.solarMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                }

                // 获取农历某年的闰月，0表示无闰月
                getLeapMonth(lunarYear) {
                    return this.lunarInfo[lunarYear - 1900] & 0xf;
                }

                // 获取农历某年闰月的天数
                getLeapMonthDays(lunarYear) {
                    if (this.getLeapMonth(lunarYear)) {
                        return (this.lunarInfo[lunarYear - 1900] & 0x10000) ? 30 : 29;
                    }
                    return 0;
                }

                // 获取农历某年某月的天数
                getLunarMonthDays(lunarYear, lunarMonth) {
                    if ((this.lunarInfo[lunarYear - 1900] & (0x10000 >> lunarMonth)) == 0) {
                        return 29;
                    } else {
                        return 30;
                    }
                }

                // 获取农历某年的总天数
                getLunarYearDays(lunarYear) {
                    let sum = 348; // 29天 * 12个月
                    for (let i = 0x8000; i > 0x8; i >>= 1) {
                        sum += (this.lunarInfo[lunarYear - 1900] & i) ? 1 : 0;
                    }
                    return sum + this.getLeapMonthDays(lunarYear);
                }

                // 判断是否是闰年
                isLeapYear(year) {
                    return ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0);
                }

                // 公历转农历
                solarToLunar(solarYear, solarMonth, solarDay) {
                    // 1900年1月31日是农历1900年正月初一
                    let baseDate = new Date(1900, 0, 31);
                    let targetDate = new Date(solarYear, solarMonth - 1, solarDay);

                    // 计算两个日期之间的天数差
                    let offset = Math.floor((targetDate - baseDate) / 86400000);

                    let lunarYear, lunarMonth, lunarDay;
                    let isLeap = false;

                    // 计算农历年
                    let days = 0;
                    for (lunarYear = 1900; lunarYear < 2100 && offset > 0; lunarYear++) {
                        days = this.getLunarYearDays(lunarYear);
                        offset -= days;
                    }

                    if (offset < 0) {
                        offset += days;
                        lunarYear--;
                    }

                    // 计算农历月
                    let leapMonth = this.getLeapMonth(lunarYear);
                    isLeap = false;

                    for (lunarMonth = 1; lunarMonth < 13 && offset > 0; lunarMonth++) {
                        // 处理闰月
                        if (leapMonth > 0 && lunarMonth == (leapMonth + 1) && !isLeap) {
                            lunarMonth--;
                            isLeap = true;
                            days = this.getLeapMonthDays(lunarYear);
                        } else {
                            days = this.getLunarMonthDays(lunarYear, lunarMonth);
                        }

                        offset -= days;

                        // 如果不是闰月，或者闰月已经处理过
                        if (isLeap && lunarMonth == (leapMonth + 1)) {
                            isLeap = false;
                        }
                    }

                    if (offset == 0 && leapMonth > 0 && lunarMonth == leapMonth + 1) {
                        if (isLeap) {
                            isLeap = false;
                        } else {
                            isLeap = true;
                            lunarMonth--;
                        }
                    }

                    if (offset < 0) {
                        offset += days;
                        lunarMonth--;
                    }

                    // 计算农历日
                    lunarDay = offset + 1;

                    // 计算天干地支年
                    let stemIndex = (lunarYear - 4) % 10;
                    let branchIndex = (lunarYear - 4) % 12;
                    stemIndex = stemIndex < 0 ? stemIndex + 10 : stemIndex;
                    branchIndex = branchIndex < 0 ? branchIndex + 12 : branchIndex;

                    let ganZhiYear = this.heavenlyStems[stemIndex] + this.earthlyBranches[branchIndex];
                    let zodiac = this.zodiacAnimals[branchIndex];

                    // 获取农历月份名称
                    let monthName = '';
                    if (isLeap) {
                        monthName = '闰' + this.lunarMonths[lunarMonth - 1];
                    } else {
                        monthName = this.lunarMonths[lunarMonth - 1];
                    }

                    // 获取农历日期名称
                    let dayName = this.lunarDays[lunarDay - 1];

                    return {
                        year: lunarYear,
                        month: lunarMonth,
                        day: lunarDay,
                        isLeap: isLeap,
                        monthName: monthName,
                        dayName: dayName,
                        ganZhiYear: ganZhiYear,
                        zodiac: zodiac,
                        fullName: ganZhiYear + '年(' + zodiac + '年) ' + monthName + dayName
                    };
                }

                // 获取节日（简化版）
                getFestival(solarMonth, solarDay, lunarMonth, lunarDay, isLeap) {
                    // 公历节日
                    if (solarMonth == 1 && solarDay == 1) return '元旦';
                    if (solarMonth == 5 && solarDay == 1) return '劳动节';
                    if (solarMonth == 10 && solarDay == 1) return '国庆节';

                    // 农历节日
                    if (!isLeap) {
                        if (lunarMonth == 1 && lunarDay == 1) return '春节';
                        if (lunarMonth == 1 && lunarDay == 15) return '元宵节';
                        if (lunarMonth == 5 && lunarDay == 5) return '端午节';
                        if (lunarMonth == 8 && lunarDay == 15) return '中秋节';
                        if (lunarMonth == 9 && lunarDay == 9) return '重阳节';
                        if (lunarMonth == 12 && lunarDay == 30) return '除夕';
                    }

                    return '';
                }
            }

            // 初始化农历计算器
            const lunarCalendar = new LunarCalendar();
            // 更新时间显示
            function updateTime() {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth() + 1;
                const day = now.getDate();
                const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];

                // 更新阳历日期
                document.getElementById('solar-date').textContent =
                    `${year}年${month}月${day}日 星期${week}`;

                // 更新农历日期
                try {
                    const lunar = lunarCalendar.solarToLunar(year, month, day);
                    const festival = lunarCalendar.getFestival(month, day, lunar.month, lunar.day, lunar.isLeap);

                    let lunarText = `${lunar.fullName}`;
                    if (festival) {
                        lunarText += ` ${festival}`;
                    }
                    document.getElementById('lunar-date').textContent = lunarText;
                } catch (error) {
                    console.error('农历计算错误:', error);
                    document.getElementById('lunar-date').textContent = '农历：计算错误';
                }

                // 更新时间
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');

                document.getElementById('current-time').textContent =
                    `${hours}:${minutes}:${seconds}`;
            }

            // 从接口获取数据
            function fetchHotelData(t) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://www.zykj0579.com/api/hotelPrice/qtData.php?t=' + t, true);
                xhr.timeout = 10000; // 10秒超时

                xhr.onload = function() {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            console.log(data);
                            if (data.update){
                                updatePageWithData(data);
                            }
                        } catch (e) {
                            console.error('解析JSON数据失败:', e);
                            if (t === 0){
                                useMockData();
                            }
                        }
                    } else {
                        console.error('网络请求失败，状态码:', xhr.status);
                        if (t === 0){
                            useMockData();
                        }
                    }
                };

                xhr.onerror = function() {
                    console.error('网络连接错误');
                    if (t === 0){
                        useMockData();
                    }
                };

                xhr.ontimeout = function() {
                    console.error('请求超时');
                    if (t === 0){
                        useMockData();
                    }
                };

                xhr.send();
            }

                };
                updatePageWithData(mockData);
            }

            // 滚动相关变量
            let scrollInterval = null;
            let scrollPosition = 0;
            let scrollSpeed = 5; // 滚动速度（像素/帧）
            let scrollPauseTime = 10000; // 滚动到顶部/底部暂停时间（毫秒）

            // 初始化滚动
            function initRoomScroll() {
                // 清除之前的滚动定时器
                if (scrollInterval) {
                    clearInterval(scrollInterval);
                    scrollInterval = null;
                }

                const container = document.getElementById('rooms-container');
                const wrapper = document.querySelector('.scroll-wrapper');

                // 如果没有wrapper或内容不足，不滚动
                if (!wrapper) return;

                const containerHeight = container.clientHeight;
                const contentHeight = wrapper.scrollHeight;

                // 只有当内容高度大于容器高度时才滚动
                if (contentHeight <= containerHeight) {
                    return;
                }

                // 复制一份内容，实现无缝滚动
                const clone = wrapper.cloneNode(true);
                wrapper.appendChild(clone);

                // 开始滚动
                let lastScrollTime = Date.now();
                let isPaused = false;

                scrollInterval = setInterval(() => {
                    if (isPaused) return;

                    const now = Date.now();
                    if (now - lastScrollTime < 100) return; // 控制60fps

                    scrollPosition -= scrollSpeed;

                    // 计算总高度（原内容+克隆内容）
                    const totalHeight = wrapper.scrollHeight / 2;

                    // 当滚动到底部时，重置位置并暂停
                    if (Math.abs(scrollPosition) >= totalHeight) {
                        scrollPosition = 0;
                        isPaused = true;
                        setTimeout(() => {
                            isPaused = false;
                            lastScrollTime = Date.now();
                        }, Math.floor(Math.random() * scrollPauseTime) + scrollPauseTime);
                    }

                    // 应用滚动
                    wrapper.style.transform = `translateY(${scrollPosition}px)`;
                    lastScrollTime = now;
                }, 100);
            }

            // 使用数据更新页面
            function updatePageWithData(data) {
                // 更新酒店名称
                if (data.hotelName) {
                    document.getElementById('hotel-name').textContent = data.hotelName;
                }
                time = data.timeStamp;

                // 更新房价表
                if (data.rooms && data.rooms.length > 0) {
                    var roomsContainer = document.getElementById('rooms-container');
                    // 创建滚动包装器
                    roomsContainer.innerHTML = '<div class="scroll-wrapper"></div>';
                    var scrollWrapper = roomsContainer.querySelector('.scroll-wrapper');

                    for (var i = 0; i < data.rooms.length; i++) {
                        var room = data.rooms[i];
                        var roomElement = document.createElement('div');
                        roomElement.className = 'room-item';
                        var rdiv = '<div class="roomNum">有房</div>';
                        if (room.houseNum > 0 && room.houseNum <= 3) {
                            rdiv = '<div class="roomNums">剩' + room.houseNum + '间</div>'
                        } else if (room.houseNum == 0) {
                            roomElement.className = 'room-items';
                            rdiv = '<div class="roomNums">售罄</div>'
                        }
                        roomElement.innerHTML =
                            '<div class="room-name">' + room.name + '</div>' + rdiv +
                            '<div class="room-desc">' + room.desc + '</div>' +
                            '<div class="room-price"><span class="room-oldPrice">¥' + room.market + '</span>¥' + room.price + '</div>';

                        scrollWrapper.appendChild(roomElement);
                    }

                    // 初始化滚动
                    setTimeout(initRoomScroll, 500); // 延迟初始化，确保DOM渲染完成
                }

                // 更新公告
                if (data.announcement) {
                    document.getElementById('announcement-wrapper').textContent = data.announcement;
                }
                // 开始公告滚动
                startAnnouncementScroll();
            }

            // 幻灯片相关变量
            var currentSlide = 0;
            var slides = document.getElementsByClassName('slide');
            var dots = document.getElementsByClassName('dot');
            var slideInterval;

            // 显示指定索引的幻灯片
            function showSlide(index) {
                for (var i = 0; i < slides.length; i++) {
                    slides[i].className = 'slide';
                    dots[i].className = 'dot';
                }

                if (slides[index]) {
                    slides[index].className = 'slide active';
                    dots[index].className = 'dot active';
                    currentSlide = index;
                }
            }

            // 下一张幻灯片
            function nextSlide() {
                var nextIndex = currentSlide + 1;
                if (nextIndex >= slides.length) {
                    nextIndex = 0;
                }
                showSlide(nextIndex);
            }

            // 开始自动轮播
            function startSlideshow() {
                if (slideInterval) {
                    clearInterval(slideInterval);
                }

                slideInterval = setInterval(nextSlide, 6000);
            }

            // 为控制点添加点击事件
            for (var i = 0; i < dots.length; i++) {
                (function(index) {
                    dots[index].onclick = function() {
                        showSlide(index);
                        startSlideshow();
                    };
                })(i);
            }

            // 公告滚动函数
            function startAnnouncementScroll() {
                var announcementWrapper = document.getElementById('announcement-wrapper');
                var announcementBar = document.getElementById('announcement-bar');
                var announcementText = announcementWrapper.textContent;

                // 创建滚动的文本（重复一次以实现无缝滚动）
                announcementWrapper.textContent = announcementText;

                var wrapperWidth = announcementWrapper.offsetWidth;
                var barWidth = announcementBar.offsetWidth;
                var position = barWidth;

                function scrollAnnouncement() {
                    position -= 1; // 每次移动1像素

                    // 当文本完全滚动出左侧边界时，重置位置
                    if (position < -wrapperWidth) {
                        position = barWidth;
                    }

                    // 应用移动
                    announcementWrapper.style.transform = 'translateX(' + position + 'px)';

                    // 继续动画
                    requestAnimationFrame(scrollAnnouncement);
                }

                // 开始滚动
                requestAnimationFrame(scrollAnnouncement);
            }

            // 图片加载失败处理
            var images = document.getElementsByTagName('img');
            for (var j = 0; j < images.length; j++) {
                images[j].onerror = function() {
                    this.style.display = 'none';
                };
            }

            // 初始化时间显示
            updateTime();
            setInterval(updateTime, 1000);
            setInterval(function(){
                fetchHotelData(time)
            }, 60000);

            // 开始幻灯片轮播
            showSlide(0);
            startSlideshow();

            // 窗口大小变化时重新初始化滚动
            window.addEventListener('resize', function() {
                setTimeout(initRoomScroll, 300);
            });

            // 从接口获取数据
            fetchHotelData(0);

            console.log('初始化完成');
        };
    </script>
